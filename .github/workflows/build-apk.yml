name: Build Android APK

on:
  push:
    branches:
      - main
      - mobile
      - feature/* # Para que funcione en la rama actual
      - "*mobile*" # Para capturar cualquier rama que se llame mobile
  workflow_dispatch: # Allows manual trigger

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Fixed Node 20 deprecation warning
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Configure Capacitor Android
        run: |
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Android usually requires Java 17

      - name: Build APK (Debug)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # Alternatively, for Release builds:
      # - name: Build APK (Release)
      #   working-directory: ./android
      #   run: ./gradlew assembleRelease
      # NOTE: For a release build, you must configure signing keys in build.gradle.

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
