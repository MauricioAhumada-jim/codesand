name: Build Android APK

on:
  push:
    branches:
      - main
      - mobile
      - feature/* # Para que funcione en la rama actual
      - "*mobile*" # Para capturar cualquier rama que se llame mobile
  workflow_dispatch: # Allows manual trigger

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Fixed Node 20 deprecation warning
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Configure Capacitor Android
        run: |
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' # Capacitor 8+ requires Java 21

      - name: Setup Keystore
        working-directory: ./android/app
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "Generating new keystore..."
            keytool -genkey -v -keystore release.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "codesand123" -keypass "codesand123" -dname "CN=Codesand, OU=Mobile, O=Codesand, L=City, ST=State, C=US"
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add release.keystore
            git commit -m "chore: add auto-generated release keystore [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "Keystore already exists."
          fi

      - name: Build AAB (Release)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
